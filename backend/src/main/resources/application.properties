server.port=${PORT:8080}
spring.application.name=expense-splitter-backend

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Runs in-memory with MySQL mode by default (zero setup needed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:expensesplitter;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
